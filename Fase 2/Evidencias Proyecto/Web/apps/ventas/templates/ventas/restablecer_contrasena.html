{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Cordillera Pets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #1a73e8 40%, #ffffff 40%);
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
        .reset-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .reset-card h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .reset-card .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-primary {
            background-color: #1a73e8;
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #155fc0;
        }
        .alert {
            border-radius: 8px;
        }
        .password-requirements {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2>🔑 Nueva Contraseña</h2>
        <p class="subtitle">Ingresa tu nueva contraseña</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" id="formReset">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="password1" class="form-label">Nueva Contraseña</label>
                <input type="password" 
                       class="form-control" 
                       id="password1" 
                       name="password1" 
                       required
                       minlength="6">
                <div class="password-requirements">
                    ✓ Mínimo 6 caracteres
                </div>
            </div>
            
            <div class="mb-3">
                <label for="password2" class="form-label">Confirmar Contraseña</label>
                <input type="password" 
                       class="form-control" 
                       id="password2" 
                       name="password2" 
                       required
                       minlength="6">
                <div class="invalid-feedback" id="passwordError">
                    Las contraseñas no coinciden
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">
                Restablecer Contraseña
            </button>
        </form>

        <hr class="my-4">

        <div class="text-center">
            <a href="{% url 'iniciosesion' %}" class="text-decoration-none">
                ← Volver a iniciar sesión
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const password1 = document.getElementById('password1');
        const password2 = document.getElementById('password2');
        const form = document.getElementById('formReset');

        // Validar contraseñas al enviar
        form.addEventListener('submit', function(e) {
            if (password1.value !== password2.value) {
                e.preventDefault();
                password2.classList.add('is-invalid');
                return false;
            } else {
                password2.classList.remove('is-invalid');
            }

            if (password1.value.length < 6) {
                e.preventDefault();
                password1.classList.add('is-invalid');
                return false;
            }
        });

        // Validar mientras escribe
        password2.addEventListener('input', function() {
            if (password1.value === password2.value) {
                password2.classList.remove('is-invalid');
                password2.classList.add('is-valid');
            } else {
                password2.classList.remove('is-valid');
                password2.classList.add('is-invalid');
            }
        });
    </script>
</body>
</html>
