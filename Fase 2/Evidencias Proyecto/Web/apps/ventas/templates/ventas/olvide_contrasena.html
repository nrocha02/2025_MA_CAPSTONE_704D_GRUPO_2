{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olvidé mi contraseña - Cordillera Pets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #1a73e8 40%, #ffffff 40%);
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
        .recovery-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .recovery-card h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .recovery-card .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-primary {
            background-color: #1a73e8;
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #155fc0;
        }
        .alert {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="recovery-card">
        <h2>🔐 Recuperar Contraseña</h2>
        <p class="subtitle">Ingresa tu RUT para recibir un enlace de recuperación</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" id="formRecuperacion">
            {% csrf_token %}
            <div class="mb-3">
                <label for="rut" class="form-label">RUT (sin puntos, con guión)</label>
                <input type="text" 
                       class="form-control" 
                       id="rut" 
                       name="rut" 
                       placeholder="12345678-9" 
                       required
                       maxlength="12">
                <div class="invalid-feedback" id="rutError">
                    RUT inválido. Formato: XXXXXXXX-X
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">
                Enviar enlace de recuperación
            </button>
        </form>

        <hr class="my-4">

        <div class="text-center">
            <a href="{% url 'iniciosesion' %}" class="text-decoration-none">
                 Volver a iniciar sesión
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validación de RUT
        function validarRUT(rut) {
            rut = rut.replace(/\./g, '').replace(/\-/g, '').toUpperCase();
            
            if (rut.length < 8) return false;
            
            const dv = rut.slice(-1);
            const numero = rut.slice(0, -1);
            
            if (!/^\d+$/.test(numero)) return false;
            
            let suma = 0;
            let multiplicador = 2;
            
            for (let i = numero.length - 1; i >= 0; i--) {
                suma += parseInt(numero.charAt(i)) * multiplicador;
                multiplicador = multiplicador < 7 ? multiplicador + 1 : 2;
            }
            
            const dvEsperado = 11 - (suma % 11);
            let dvCalculado;
            
            if (dvEsperado === 11) dvCalculado = '0';
            else if (dvEsperado === 10) dvCalculado = 'K';
            else dvCalculado = dvEsperado.toString();
            
            return dv === dvCalculado;
        }

        // Formatear RUT mientras se escribe
        const inputRUT = document.getElementById('rut');
        inputRUT.addEventListener('input', function(e) {
            let valor = e.target.value.replace(/\./g, '').replace(/\-/g, '').toUpperCase();
            
            if (valor.length > 1) {
                valor = valor.slice(0, -1) + '-' + valor.slice(-1);
            }
            
            e.target.value = valor;
        });

        // Validar antes de enviar
        document.getElementById('formRecuperacion').addEventListener('submit', function(e) {
            const rut = inputRUT.value;
            
            if (!validarRUT(rut)) {
                e.preventDefault();
                inputRUT.classList.add('is-invalid');
                return false;
            } else {
                inputRUT.classList.remove('is-invalid');
            }
        });
    </script>
</body>
</html>
